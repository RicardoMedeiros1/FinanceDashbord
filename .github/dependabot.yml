# Avisa (e abre pull requests) quando uma dependência ou ação do GitHub tem versão nova ou correção de segurança.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
